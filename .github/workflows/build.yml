name: Build AMERICIUM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Build mod
        run: |
          set +e
          gradle build --stacktrace --no-daemon > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -n -E "What went wrong|Could not|error:|FAILED|Caused by|not found|No signature" build.log | head -25 > errs.txt
            echo "::error title=gradle-errors::$(head -c 3500 errs.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=gradle-variants::$(grep -A18 'What went wrong' build.log | cut -c1-300 | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          fi
          exit $code
      - name: Discover camp structure data
        if: always()
        run: python3 .github/scripts/discover.py
      - name: Dump NBT formats
        if: always()
        continue-on-error: true
        run: python3 .github/scripts/nbtdump.py
      - name: Server smoke test
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        run: python3 .github/scripts/smoke.py
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: americium-jar
          path: build/libs/*.jar
